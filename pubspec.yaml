name: hisaab
description: "An offline-first personal finance tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Database
  drift: ^2.22.0
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol

  # State Management & Navigation
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.2

  # Domain & Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.3

  # UI & Visuals
  fl_chart: ^1.2.0

  # Security & Biometrics
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.9.0

  # Testing & Quality
  mocktail: ^1.0.4
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
